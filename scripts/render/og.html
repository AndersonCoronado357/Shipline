<!doctype html><html lang="es"><head><meta charset="utf-8">

html,body{width:1200px;height:630px;overflow:hidden;background:#C9F7EC;color:#0E3533;font-family:Nunito,sans-serif}

.nube{position:absolute;height:48px;border-radius:999px;background:#fff}

.marca{position:absolute;left:80px;top:96px}
.marca svg{width:108px;height:108px}

p{font-weight:800;font-size:34px;color:#2F5F5A;margin-top:12px}
.de{position:absolute;left:80px;bottom:44px;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:#E8FFF8;z-index:2}
.de img{width:28px;height:28px}.de b{font-weight:900}
